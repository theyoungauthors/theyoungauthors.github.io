<style>
  :root{
    --maroon:#7A1030;
    --maroon-dark:#54081F;
    --paper:#F4EEDF;
    --paper-light:#FBF8F1;
    --ink:#2A2320;
    --ink-soft:#5B5048;
    --brass:#AD8748;
    --brass-light:#D8B981;
    --line: rgba(42,35,32,0.14);
    --radius: 2px;
    --maxw: 1180px;
  }
  *{box-sizing:border-box;}
  html{
    scroll-behavior:smooth;
    scroll-padding-top: 100px;
    background: transparent !important;
  }
  body{
    margin:0;
    html, body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  height: auto;
}
    background:var(--paper);
    color:var(--ink);
    font-family:'Manrope', sans-serif;
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    width:100%;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 clamp(20px,5vw,64px);}

  /* ---------- Typography ---------- */
  .eyebrow{
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--brass);
    margin:0 0 14px 0;
  }
  .h1{
    font-family:'Playfair Display',serif;
    font-weight:600;
    font-size:clamp(34px,5.4vw,64px);
    line-height:1.08;
    letter-spacing:-0.01em;
    margin:0;
  }
  .h2{
    font-family:'Playfair Display',serif;
    font-weight:600;
    font-size:clamp(28px,3.6vw,42px);
    line-height:1.15;
    margin:0;
  }
  .h3{
    font-family:'Playfair Display',serif;
    font-weight:600;
    font-size:clamp(19px,2vw,22px);
    line-height:1.3;
    margin:0;
  }
  .body-lg{ font-size:clamp(16px,1.6vw,19px); line-height:1.7; color:var(--ink-soft); }
  .body{ font-size:16px; line-height:1.7; color:var(--ink-soft); }
  .caption{ font-size:13px; letter-spacing:0.03em; color:var(--ink-soft); }

  .sub-tagline {
    font-style: italic;
    color: var(--maroon);
    font-size: clamp(15px, 1.4vw, 17px);
    margin-top: 16px;
    font-weight: 500;
  }

  section, footer { 
    padding:clamp(64px,9vw,120px) 0; 
    position:relative; 
    scroll-margin-top: 100px;
  }

  .stitch-divider{
    width:100%; height:1px;
    background-image: repeating-linear-gradient(to right, var(--brass-light) 0 8px, transparent 8px 16px);
    opacity:0.9;
  }

  /* ---------- Header / Nav ---------- */
  header{
    position: sticky;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    background: rgba(244,238,223,0.96);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .nav{
    max-width:var(--maxw); margin:0 auto; padding:16px clamp(20px,5vw,64px);
    display:flex; align-items:center; justify-content:space-between;
  }
  .logo{
    font-family:'Playfair Display',serif; 
    font-weight:700; 
    font-size:20px;
    letter-spacing:-0.01em;
    color:var(--maroon);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-img{
    height: 38px;
    width: auto;
    object-fit: contain;
    display: block;
  }
  .navlinks{ display:flex; gap:clamp(16px,2.4vw,34px); align-items:center; }
  .navlinks a{
    font-size:13px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--ink); padding:6px 0; border-bottom:1px solid transparent;
    transition:border-color .2s ease, color .2s ease;
    white-space: nowrap;
  }
  .navlinks a:hover{ color:var(--maroon); border-color:var(--brass); }
  .navcta{
    font-size:13px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;
    background:var(--maroon); color:var(--paper-light); padding:10px 20px; border-radius:var(--radius);
    white-space:nowrap;
  }
  .navcta:hover{ background:var(--maroon-dark); }

  /* ---------- Mobile Menu Styles ---------- */
  @media (max-width:860px){
    body {
      padding-top: 105px;
    }
    .nav {
      flex-wrap: wrap;
      padding: 12px clamp(20px,5vw,64px);
      gap: 12px;
    }
    .navlinks {
      width: 100%;
      display: flex;
      flex-direction: row;
      justify-content: flex-end;
      align-items: center;
      gap: 24px;
      padding: 10px 0 4px 0;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      border-top: 1px solid rgba(42,35,32,0.08);
    }
    .navlinks::-webkit-scrollbar {
      display: none;
    }
    .navlinks a {
      font-size: 12px;
      padding: 4px 0;
    }
    .navcta {
      font-size: 11px;
      padding: 6px 14px;
    }
  }

  /* ---------- About ---------- */
  .about-grid{
    display:grid; grid-template-columns:0.95fr 1.05fr; gap:clamp(36px,6vw,80px); align-items:center;
  }
  .about-copy .h2{ margin-bottom:22px; max-width:14ch; }
  .about-copy .body-lg{ margin-bottom:0; }
  
  .placeholder-frame {
    width: 100%;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 12px 32px rgba(42,35,32,0.12);
    border: 1px solid var(--line);
    background: var(--paper-light);
  }
  .placeholder-frame img {
    width: 100%;
    height: auto;
    object-fit: cover;
  }

  /* ---------- Program Section ---------- */
  .mv-grid{ display:grid; grid-template-columns:1fr 1fr; gap:28px; margin-bottom: 60px; }
  .mv-card{
    background:var(--paper-light); border:1px solid var(--line); border-radius:var(--radius);
    padding:clamp(28px,3.4vw,42px); height:100%;
  }
  .mv-card .icon-row{ display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .mv-card .icon-row svg{ width:26px; height:26px; color:var(--maroon); }
  .mv-card .h3{ margin-bottom:0; }
  .mv-card p{ margin:16px 0 0; }

  .fw-intro{ max-width:760px; margin-bottom:clamp(40px,5vw,60px); }
  
  /* Infographic Graphic Container */
  /* ---------- Framework Infographic ---------- */
.infographic-wrapper {
  width: 100%;
  max-width: 900px;
  margin: 50px auto 70px;
  background: transparent;
}

.infographic-img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: var(--radius);
  background: transparent;
}

  .delivery-grid{ display:grid; grid-template-columns:1fr 1fr; gap:clamp(40px,6vw,80px); align-items:start; margin-bottom: 60px; }
  .delivery-copy .body-lg{ margin-bottom:0; }
  .delivery-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
  .delivery-list li{
    display:flex; align-items:flex-start; gap:16px; padding:18px 0;
    border-bottom:1px solid var(--line); font-size:16px; color:var(--ink);
  }
  .delivery-list li:first-child{ padding-top:0; }
  .delivery-list svg{ width:20px; height:20px; color:var(--brass); flex-shrink:0; margin-top:2px; }

  .fees-band{ background:var(--maroon); color:var(--paper-light); border-radius: var(--radius); padding: clamp(32px, 5vw, 56px); }
  .fees-band .eyebrow{ color:var(--brass-light); }
  .fees-band .h2{ color:var(--paper-light); margin-bottom:8px; }
  .fees-grid{ display:grid; grid-template-columns:1fr; max-width:540px; margin-top:32px; }
  .fee-card{
    border:1px solid rgba(244,238,223,0.28); border-radius:var(--radius);
    padding:clamp(24px,3vw,32px);
